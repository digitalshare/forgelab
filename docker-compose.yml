services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forgelab
      POSTGRES_PASSWORD: forgelab
      POSTGRES_DB: forgelab
    ports:
      - "5432:5432"
    volumes:
      - forgelab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgelab"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - forgelab_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  forgelab_pgdata:
  forgelab_redisdata:
